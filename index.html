function login(){var p=document.getElementById('pwd').value;if(p==='luciano4090'){sessionStorage.setItem('qg_auth','1');showApp();}else{alert('Senha incorreta');}}
if(sessionStorage.getItem('qg_auth')==='1')showApp();
function showApp(){document.getElementById('auth').style.display='none';document.getElementById('app').style.display='block';initApp();}
function initApp(){
var s=DATA.stats;
document.getElementById('statsBar').innerHTML=
'<div class="stat"><i class="fa-solid fa-paper-plane"></i> Enviados: <b>'+s.total_enviados+'</b></div>'+
'<div class="stat"><i class="fa-solid fa-clock"></i> Na Fila: <b>'+s.total_pendentes+'</b></div>'+
'<div class="stat"><i class="fa-brands fa-facebook"></i> FB: <b>'+s.total_fb+'</b></div>'+
'<div class="stat"><i class="fa-brands fa-instagram"></i> IG: <b>'+s.total_ig+'</b></div>'+
'<div class="stat"><i class="fa-solid fa-triangle-exclamation"></i> Erros IG: <b>'+s.total_erros_ig+'</b></div>';
var tabs=[
{id:'env',label:'Enviados',icon:'fa-paper-plane',count:DATA.enviados.length},
{id:'pend',label:'Na Fila',icon:'fa-clock',count:DATA.pendentes.length},
{id:'all',label:'Todos',icon:'fa-list',count:DATA.enviados.length+DATA.pendentes.length},
{id:'rev',label:'Revis\u00e3o',icon:'fa-flag',count:DATA.revisao.length},
{id:'err',label:'Erros IG',icon:'fa-bug',count:DATA.erros_ig.length}
];
document.getElementById('tabsBar').innerHTML=tabs.map(function(t){
return '<div class="tab" data-tab="'+t.id+'" onclick="switchTab(\''+t.id+'\')"><i class="fa-solid '+t.icon+'"></i> '+t.label+'<span class="count">'+t.count+'</span></div>';
}).join('');
switchTab('env');
}
function switchTab(id){
document.querySelectorAll('.tab').forEach(function(t){t.classList.toggle('active',t.dataset.tab===id);});
var c=document.getElementById('content');
if(id==='env')renderCards(DATA.enviados,c,true);
else if(id==='pend')renderCards(DATA.pendentes,c,false);
else if(id==='all')renderCards(DATA.enviados.concat(DATA.pendentes),c,true);
else if(id==='rev')renderReview(c);
else if(id==='err')renderErrors(c);
}
function platBadge(p){var u=p.toUpperCase();if(u.indexOf('FACEBOOK')>=0)return'<span class="badge badge-fb"><i class="fa-brands fa-facebook"></i> FB</span>';return'<span class="badge badge-ig"><i class="fa-brands fa-instagram"></i> IG</span>';}
function classifBadge(cl){var u=(cl||'').toUpperCase();if(u==='APOIADOR')return'<span class="badge badge-apoiador">Apoiador</span>';if(u.indexOf('COORD')>=0)return'<span class="badge badge-coord">Coordenador</span>';if(u==='CONTRA')return'<span class="badge badge-contra">Contra</span>';return'<span class="badge badge-neutro">Neutro</span>';}
function linkBtn(item){if(!item.link)return'';return'<a class="btn" href="'+item.link+'" target="_blank" rel="noopener"><i class="fa-solid fa-arrow-up-right-from-square"></i> Ver Coment\u00e1rio</a>';}
function renderCards(items,container,showResp){
if(!items.length){container.innerHTML='<div class="empty"><i class="fa-solid fa-inbox" style="font-size:48px;margin-bottom:16px;display:block;"></i>Nenhum item</div>';return;}
container.innerHTML=items.map(function(it){
var resp='';if(showResp&&it.resposta)resp='<div class="card-response"><i class="fa-solid fa-robot"></i> '+esc(it.resposta)+'</div>';
var statusClass=it.link_responder.indexOf('ENVIADO')>=0?'status-enviado':'status-pendente';
var statusText=it.link_responder.indexOf('ENVIADO')>=0?'\u2705 Enviado':'\u23f3 Pendente';
return '<div class="card">'+
'<div class="card-header"><span class="card-author">'+esc(it.autor)+'</span><div class="card-meta">'+platBadge(it.plat)+classifBadge(it.classif)+'<span class="badge" style="background:var(--surface2);color:var(--text3);">Row '+it.row+'</span></div></div>'+
'<div class="card-comment">'+esc(it.comentario||'(sem texto)')+'</div>'+
resp+
'<div class="card-actions"><span class="'+statusClass+'" style="font-size:12px;">'+statusText+'</span>'+linkBtn(it)+'</div>'+
'</div>';
}).join('');
}
function renderReview(container){
if(!DATA.revisao.length){container.innerHTML='<div class="empty"><i class="fa-solid fa-check-circle" style="font-size:48px;margin-bottom:16px;display:block;color:var(--green);"></i>Nenhum coment\u00e1rio t\u00f3xico detectado \u2014 tudo limpo!</div>';return;}
container.innerHTML=DATA.revisao.map(function(it){
var hl=esc(it.comentario);
(it.toxic_words||[]).forEach(function(w){hl=hl.replace(new RegExp('('+w+')','gi'),'<mark>$1</mark>');});
return '<div class="card" style="border-left:3px solid var(--red);">'+
'<div class="card-header"><span class="card-author">'+esc(it.autor)+'</span><div class="card-meta">'+platBadge(it.plat)+classifBadge(it.classif)+
'<span class="badge badge-'+(it.severity||'alto').toLowerCase()+'">'+esc(it.severity||'ALTO')+'</span></div></div>'+
'<div class="card-comment">'+hl+'</div>'+
'<div class="card-actions">'+linkBtn(it)+'</div></div>';
}).join('');
}
function renderErrors(container){
container.innerHTML='<div class="diagnosis"><h3><i class="fa-solid fa-stethoscope"></i> Diagn\u00f3stico</h3>'+
'<p>A Meta Graph API <b>n\u00e3o suporta</b> <code>POST /{comment_id}/likes</code> para coment\u00e1rios do Instagram.<br>'+
'Todos os 79 erros s\u00e3o <code>400 Bad Request</code> por essa limita\u00e7\u00e3o.<br><br>'+
'<b>Fix aplicado:</b> Workflow "Resposta Segura" agora filtra IG no n\u00f3 "Filtrar Pendentes".<br>'+
'<b>Pr\u00f3ximo passo:</b> Criar n\u00f3 de resposta IG via <code>POST /{comment_id}/replies</code>.</p></div>'+
'<table><thead><tr><th>Row</th><th>Autor</th><th>Coment\u00e1rio</th><th>Post</th><th>Status</th><th>Link</th></tr></thead><tbody>'+
DATA.erros_ig.map(function(it){
return '<tr><td>'+it.row+'</td><td>'+esc(it.autor)+'</td><td title="'+esc(it.comentario)+'">'+esc((it.comentario||'').substring(0,60))+'</td>'+
'<td style="font-family:var(--mono);font-size:11px;">'+esc((it.link||'').split('/')[4]||'')+'</td>'+
'<td class="status-erro">ERRO 400</td>'+
'<td>'+(it.link?'<a class="btn" href="'+it.link+'" target="_blank"><i class="fa-solid fa-arrow-up-right-from-square"></i></a>':'')+'</td></tr>';
}).join('')+
'</tbody></table>';
}
function esc(s){if(!s)return'';var d=document.createElement('div');d.textContent=s;return d.innerHTML;}
</script>
