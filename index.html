  var cc={"APOIADOR":"var(--green)","COORDENADOR_POTENCIAL":"var(--purple)","CONTRA":"var(--red)","NEUTRO":"var(--muted)"};
  var pc={"Facebook":"#3b82f6","Instagram":"#ec4899"};var cb="",pb="";
  Object.entries(cl).sort(function(a,b){return b[1]-a[1]}).forEach(function(v){cb+=br(v[0],v[1],mC,cc[v[0]]||"var(--muted)")});
  Object.entries(pt).sort(function(a,b){return b[1]-a[1]}).forEach(function(v){pb+=br(v[0],v[1],mP,pc[v[0]]||"var(--muted)")});
  $("mns").innerHTML='<div class="mn"><h3>Classificacao</h3>'+cb+'</div><div class="mn"><h3>Plataforma</h3>'+pb+'</div>';
  $("pe").innerHTML=tb(env,0);$("pp").innerHTML=tb(pend,0);$("pa").innerHTML=tb(all,1);rR(rev);rE(err,st);
  $("lu").textContent="Dados carregados";
}
function kp(n,c,l){return '<div class="kp"><div class="kv '+c+'">'+n+'</div><div class="kl">'+l+'</div></div>'}
function br(lb,n,mx,co){return '<div class="brow"><span class="blb">'+lb+'</span><div class="btk"><div class="bfl" style="width:'+n/mx*100+'%;background:'+co+'"></div></div><span class="bnn">'+n+'</span></div>'}
function bg(c){var m={"APOIADOR":"ba","COORDENADOR_POTENCIAL":"bc","CONTRA":"bx"};return '<span class="bd '+(m[c]||"")+'">'+( c||"-")+'</span>'}
function plat(p){var ig=(p||"").toUpperCase().indexOf("INSTAGRAM")>=0;return '<span class="bd '+(ig?"bi":"bfb")+'">'+( ig?"IG":"FB")+'</span>'}
function tc(s,n){return(s||"").length>n?(s||"").substring(0,n)+"...":s||"-"}
function lnk(u){return u?'<a href="'+u+'" target="_blank" class="lk">Ver</a>':""}
function tb(items,ss){
  if(!items.length)return '<div class="mt">Nenhum item</div>';
  var h='<div class="tw"><table><thead><tr><th>Data</th><th>Plat</th><th>Autor</th><th>Classif</th><th>Comentario</th>';
  if(ss)h+='<th>Status</th>';h+='<th></th></tr></thead><tbody>';
  items.forEach(function(e){
    var s=(e.st||"").indexOf("ENVIADO")===0?'<span class="bd be">OK</span>':'<span class="bd bp">Fila</span>';
    h+='<tr><td class="ts">'+tc(e.dh,10)+'</td><td>'+plat(e.pl)+'</td><td>'+tc(e.nm,12)+'</td><td>'+bg(e.cl)+'</td><td class="cm">'+tc(e.cm,90)+'</td>';
    if(ss)h+='<td>'+s+'</td>';
    h+='<td>'+lnk(e.lk)+'</td></tr>';});
  return h+'</tbody></table></div>'}
function rR(data){
  var p=$("prv");if(!data||!data.length){p.innerHTML='<div class="mt">Nenhum suspeito</div>';return}
  var h='<div class="al" style="border-color:var(--orange)"><h3 style="color:var(--orange)">Revisao Humana</h3><p>Comentarios curtidos/respondidos pela automacao com sinais negativos.</p></div>';
  data.forEach(function(e){
    var sv=e.severity==="CRITICO"?'<span class="bd bx">CRITICO</span>':'<span class="bd" style="background:rgba(245,158,11,.12);color:var(--orange)">ALTO</span>';
    var ac=e.acao==="CURTIDO"?'<span class="bd" style="background:rgba(129,140,248,.12);color:var(--accent2)">Curtido</span> ':"";ac+=bg(e.cl);
    var cm=(e.cm||"").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\n/g,"<br>");
    (e.negKw||[]).forEach(function(kw){var i=cm.toLowerCase().indexOf(kw.toLowerCase());if(i>=0)cm=cm.substring(0,i)+"<mark>"+cm.substring(i,i+kw.length)+"</mark>"+cm.substring(i+kw.length)});
    h+='<div class="rc sev-'+e.severity+'"><div class="rh"><div>'+sv+' '+ac+' '+plat(e.pl)+'</div><div>'+lnk(e.lk)+'</div></div><div class="rt">'+cm+'</div><div class="rf">'+(e.negKw||[]).map(function(k){return '<span class="rk">'+k+'</span>'}).join("")+'</div></div>';
  });p.innerHTML=h}
function rE(data,st){
  var p=$("perr");var n=st.igErrors||data.length;
  var h='<div class="al"><h3>'+n+' erros Instagram</h3><p>API nao suporta <code>POST /likes</code> para IG. Fix ja aplicado no n8n.</p></div>';
  h+='<div class="tw"><table><thead><tr><th>Data</th><th>Classif</th><th>Comentario</th><th></th></tr></thead><tbody>';
  (data||[]).forEach(function(e){h+='<tr><td class="ts">'+tc(e.dh,10)+'</td><td>'+bg(e.cl)+'</td><td class="cm">'+tc(e.cm,100)+'</td><td>'+lnk(e.lk)+'</td></tr>'});
  h+='</tbody></table></div>';p.innerHTML=h}
document.querySelectorAll(".tab").forEach(function(t){t.addEventListener("click",function(){document.querySelectorAll(".tab").forEach(function(x){x.classList.remove("on")});document.querySelectorAll(".pnl").forEach(function(x){x.classList.remove("on")});t.classList.add("on");$({env:"pe",pend:"pp",all:"pa",review:"prv",errors:"perr"}[t.dataset.t]).classList.add("on")})});
</script>
</body></html>
