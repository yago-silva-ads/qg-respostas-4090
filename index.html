function init() {

  document.getElementById("cerr").textContent=errors.length;

  var pc={"Facebook":"#3b82f6","Instagram":"#ec4899"};var cb="",pb="";

  Object.entries(plt).sort(function(a,b){return b[1]-a[1]}).forEach(function(kv){pb+='<div class="bar-r"><span class="bar-lb">'+kv[0]+'</span><div class="bar-tk"><div class="bar-fl" style="width:'+kv[1]/mxP*100+'%;background:'+(pc[kv[0]]||"var(--muted)")+'"></div></div><span class="bar-n">'+kv[1]+'</span></div>'});

function bg(c){var m={"APOIADOR":"b-apo","COORDENADOR_POTENCIAL":"b-coord","CONTRA":"b-con"};return '<span class="bdg '+(m[c]||"")+'">'+( c||"-")+'</span>'}
function pB(p){var ig=(p||"").toUpperCase().indexOf("INSTAGRAM")>=0;return '<span class="bdg '+(ig?"b-ig":"b-fb")+'">'+(ig?"IG":"FB")+'</span>'}
function tr(s,n){return(s||"").length>n?(s||"").substring(0,n)+"...":s||"-"}
function bT(items,ss){
  if(!items.length)return '<div class="empty">Nenhum item</div>';
  var h='<div class="tw"><table><thead><tr><th>Data</th><th>Plat</th><th>Autor</th><th>Classif</th><th>Comentario</th>';
  if(ss)h+='<th>Status</th>';h+='</tr></thead><tbody>';
  items.forEach(function(e){
    var stH=(e.st||"").indexOf("ENVIADO")===0?'<span class="bdg b-e">OK</span>':'<span class="bdg b-p">Fila</span>';
    h+='<tr><td class="ts">'+tr(e.dh,16)+'</td><td>'+pB(e.pl)+'</td><td><span class="nm">'+tr(e.nm,14)+'</span></td><td>'+bg(e.cl)+'</td><td class="cm"><div class="cm-t">'+tr(e.cm,100)+'</div></td>';
    if(ss)h+='<td>'+stH+'</td>';
    h+='</tr>';
  });
  return h+'</tbody></table></div>';
}
function renderReview(data){
  var p=document.getElementById("preview");
  if(!data||!data.length){p.innerHTML='<div class="empty">Nenhum comentario suspeito!</div>';return}
  var html='<div class="err-alert" style="border-color:var(--orange)"><h3 style="color:var(--orange)">Revisao Humana</h3><p>Comentarios curtidos/respondidos pela automacao com sinais negativos.</p></div>';
  data.forEach(function(e){
    var sevBdg=e.severity==="CRITICO"?'<span class="bdg b-con">CRITICO</span>':'<span class="bdg" style="background:rgba(245,158,11,.12);color:var(--orange)">ALTO</span>';
    var acBdg=e.acao==="CURTIDO"?'<span class="bdg" style="background:rgba(129,140,248,.12);color:var(--accent2)">Curtido</span> ':"";
    acBdg+=bg(e.cl);
    var cmHtml=(e.cm||"").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\n/g,"<br>");
    (e.negKw||[]).forEach(function(kw){
      var idx=cmHtml.toLowerCase().indexOf(kw.toLowerCase());
      if(idx>=0){cmHtml=cmHtml.substring(0,idx)+"<mark>"+cmHtml.substring(idx,idx+kw.length)+"</mark>"+cmHtml.substring(idx+kw.length)}
    });
    html+='<div class="rev-card sev-'+e.severity+'">';
    html+='<div class="rev-head"><div>'+sevBdg+' '+acBdg+' '+pB(e.pl)+'</div><span class="rev-row">Row #'+e.row+'</span></div>';
    html+='<div class="rev-text">'+cmHtml+'</div>';
    html+='<div class="rev-foot"><div>'+(e.negKw||[]).map(function(k){return '<span class="rev-kw">'+k+'</span>'}).join("")+'</div></div></div>';
  });
  p.innerHTML=html;
}
function renderErrors(data){
  var p=document.getElementById("perrors");
  var igErr=(data||[]).filter(function(e){return(e.pl||"").toUpperCase().indexOf("INSTAGRAM")>=0});
  var html='<div class="err-alert"><h3>Instagram: '+igErr.length+' erros</h3><p>API nao suporta <code>POST /likes</code> para IG.</p><ul class="err-fix"><li><strong>Fix 1:</strong> Filtrar IG no n8n (ja aplicado)</li><li><strong>Fix 2:</strong> Para responder IG: <code>POST /{id}/replies</code></li></ul></div>';
  html+='<div class="tw"><table><thead><tr><th>Data</th><th>Plat</th><th>Classif</th><th>Comentario</th><th>Erro</th></tr></thead><tbody>';
  (data||[]).forEach(function(e){html+='<tr><td class="ts">'+tr((e.dh||"").substring(0,16),16)+'</td><td>'+pB(e.pl)+'</td><td>'+bg(e.cl)+'</td><td class="cm">'+tr(e.cm,80)+'</td><td><span class="bdg b-con">400</span></td></tr>'});
  html+='</tbody></table></div>';p.innerHTML=html;
}
