<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QG Respostas 4090 — Live Feed</title>
<style>
  :root{
    --bg:#0a0e1a; --card:#121829; --card2:#1a2138; --line:#26304d;
    --txt:#e7ecf5; --mut:#8b97b3; --azul:#3b82f6; --verde:#22c55e;
    --amar:#f59e0b; --verm:#ef4444; --rox:#8b5cf6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:system-ui,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--txt);padding:20px;max-width:1100px;margin:0 auto}
  .top{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:6px}
  h1{font-size:22px;display:flex;align-items:center;gap:10px}
  .live{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--verde);border:1px solid var(--verde);border-radius:20px;padding:3px 10px}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--verde);animation:pulse 1.6s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  .sub{color:var(--mut);font-size:13px;margin-bottom:18px}
  .flow{background:linear-gradient(90deg,#12213a,#131a2e);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-bottom:18px;font-size:13px;color:var(--mut);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .flow b{color:var(--verde)}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:22px}
  .kpi{background:var(--card);border-radius:14px;padding:16px;border-left:4px solid var(--azul)}
  .kpi .v{font-size:28px;font-weight:800}
  .kpi .l{color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.6px;margin-top:2px}
  .kpi.verde{border-color:var(--verde)} .kpi.amar{border-color:var(--amar)}
  .kpi.verm{border-color:var(--verm)} .kpi.rox{border-color:var(--rox)}
  .tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
  .tab{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 14px;cursor:pointer;font-size:13px;color:var(--mut);display:flex;align-items:center;gap:6px}
  .tab.active{background:var(--azul);color:#fff;border-color:var(--azul)}
  .tab .n{background:rgba(255,255,255,.15);border-radius:20px;padding:1px 8px;font-size:12px}
  .item{background:var(--card);border-radius:12px;padding:14px 16px;margin-bottom:10px;border-left:3px solid var(--line)}
  .item.APOIADOR,.item.VOTO_DECLARADO{border-left-color:var(--verde)}
  .item.POTENCIAL,.item.COORDENADOR_POTENCIAL,.item.COLETIVO_POTENCIAL{border-left-color:var(--amar)}
  .item.CONTRA{border-left-color:var(--verm)}
  .ihead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;margin-bottom:6px}
  .tag{font-size:10px;font-weight:700;padding:2px 7px;border-radius:6px;text-transform:uppercase}
  .tag.APOIADOR,.tag.VOTO_DECLARADO{background:rgba(34,197,94,.18);color:var(--verde)}
  .tag.POTENCIAL,.tag.COORDENADOR_POTENCIAL,.tag.COLETIVO_POTENCIAL{background:rgba(245,158,11,.18);color:var(--amar)}
  .tag.CONTRA{background:rgba(239,68,68,.18);color:var(--verm)}
  .tag.NEUTRO{background:rgba(139,151,179,.15);color:var(--mut)}
  .plat{font-size:11px;color:var(--mut)}
  .txt{font-size:14px;color:var(--txt);line-height:1.45}
  .resp{margin-top:8px;padding:10px 12px;background:var(--card2);border-radius:8px;font-size:13px;color:#cfe0ff;border-left:2px solid var(--azul)}
  .meta{font-size:11px;color:var(--mut);margin-top:6px;display:flex;gap:12px;flex-wrap:wrap}
  a.link{color:var(--azul);text-decoration:none;font-size:12px}
  .hidden{display:none}
  .loading{text-align:center;color:var(--mut);padding:40px}
  .err{background:rgba(239,68,68,.1);border:1px solid var(--verm);border-radius:10px;padding:14px;color:#ffd9d9;font-size:13px;margin-bottom:16px}
</style>
</head>
<body>
  <div class="top">
    <h1>🗳️ QG Respostas 4090</h1>
    <span class="live"><span class="dot"></span> LIVE</span>
  </div>
  <div class="sub" id="sub">Carregando dados da planilha…</div>

  <div class="flow">
    🤖 <b>Fluxo automático ativo</b> — o Cérebro IA lê comentários, gera respostas com IA (Groq) e grava na planilha <b>a cada 30 min</b>. Este painel reflete os dados reais em tempo real.
  </div>

  <div class="err hidden" id="err"></div>

  <div class="kpis" id="kpis"></div>

  <div class="tabs" id="tabs"></div>
  <div id="feed"><div class="loading">⏳ Buscando comentários…</div></div>

<script>
const SHEET_ID = "1XqxOih0RSSMWXA7X3DPYOt3_xk0jK9yjlLpq0-qsyME";
const TAB = "COMENTARIOS";
// endpoint gviz -> CSV (funciona se a planilha estiver com "qualquer pessoa com o link: leitor")
const URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(TAB)}`;

const ALVO = ["APOIADOR","VOTO_DECLARADO","POTENCIAL","COORDENADOR_POTENCIAL","COLETIVO_POTENCIAL"];

function parseCSV(text){
  // parser simples que respeita aspas
  const rows=[]; let row=[], cur="", q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){
      if(c==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; }
      else cur+=c;
    }else{
      if(c==='"')q=true;
      else if(c===','){row.push(cur);cur="";}
      else if(c==='\n'){row.push(cur);rows.push(row);row=[];cur="";}
      else if(c==='\r'){}
      else cur+=c;
    }
  }
  if(cur.length||row.length){row.push(cur);rows.push(row);}
  return rows;
}

function kpi(v,l,cls){return `<div class="kpi ${cls}"><div class="v">${v.toLocaleString('pt-BR')}</div><div class="l">${l}</div></div>`;}

fetch(URL).then(r=>{if(!r.ok)throw new Error("HTTP "+r.status);return r.text();}).then(csv=>{
  const rows=parseCSV(csv);
  const head=rows[0].map(h=>h.trim());
  const idx=n=>head.indexOf(n);
  const iCls=idx("classificacao"), iAcao=idx("acao_realizada"),
        iResp=idx("relevancia_score"), iTxt=idx("mensagem")>=0?idx("mensagem"):idx("comentario"),
        iNome=idx("autor_nome")>=0?idx("autor_nome"):idx("nome"),
        iPlat=idx("plataforma"), iPerma=idx("permalink")>=0?idx("permalink"):idx("link_responder"),
        iData=idx("data_comentario")>=0?idx("data_comentario"):idx("data_hora");

  const data=rows.slice(1).filter(r=>r.length>3);
  let respondido=0, elegiveis=0, semResp=0, contra=0, apoiador=0;
  const enviados=[];
  data.forEach(r=>{
    const cls=(r[iCls]||"").trim().toUpperCase();
    const acao=(r[iAcao]||"").trim().toUpperCase();
    if(cls==="CONTRA")contra++;
    if(cls==="APOIADOR")apoiador++;
    if(ALVO.includes(cls)){
      elegiveis++;
      if(acao==="RESPONDIDO"){respondido++; enviados.push(r);}
      else semResp++;
    }
  });

  const sub=document.getElementById("sub");
  sub.textContent=`Atualizado agora · ${data.length.toLocaleString('pt-BR')} comentários na base · ${new Date().toLocaleString('pt-BR')}`;

  document.getElementById("kpis").innerHTML=
    kpi(respondido,"Respostas enviadas","verde")+
    kpi(semResp,"Na fila (aguardando)","amar")+
    kpi(apoiador,"Apoiadores","verde")+
    kpi(elegiveis,"Elegíveis p/ resposta","rox")+
    kpi(contra,"Contrários (monitorar)","verm")+
    kpi(data.length,"Total captado","azul");

  // Feed: enviados mais recentes primeiro
  enviados.reverse();
  const feed=document.getElementById("feed");
  if(!enviados.length){feed.innerHTML='<div class="loading">Nenhuma resposta enviada ainda — o fluxo vai preencher isto nos próximos ciclos.</div>';}
  else{
    feed.innerHTML=enviados.slice(0,100).map(r=>{
      const cls=(r[iCls]||"").trim().toUpperCase();
      const nome=(r[iNome]||"Anônimo").trim()||"Anônimo";
      const plat=(r[iPlat]||"").trim();
      const txt=(r[iTxt]||"").trim();
      const resp=iResp>=0?(r[iResp]||"").trim():"";
      const perma=iPerma>=0?(r[iPerma]||"").trim():"";
      const dt=(r[iData]||"").trim().slice(0,10);
      const respHtml=(resp && isNaN(resp))?`<div class="resp">💬 ${resp}</div>`:"";
      const linkHtml=/^https?:/.test(perma)?`<a class="link" href="${perma}" target="_blank">🔗 Abrir comentário</a>`:"";
      return `<div class="item ${cls}">
        <div class="ihead"><b>${nome}</b> <span class="tag ${cls}">${cls}</span> <span class="plat">${plat} · ${dt}</span></div>
        <div class="txt">${txt}</div>${respHtml}
        <div class="meta">${linkHtml}</div>
      </div>`;
    }).join("");
  }
}).catch(e=>{
  document.getElementById("sub").textContent="";
  const err=document.getElementById("err");
  err.classList.remove("hidden");
  err.innerHTML=`⚠️ Não consegui ler a planilha ao vivo (${e.message}).<br>
  Para o painel funcionar, a planilha precisa estar com <b>"Qualquer pessoa com o link: Leitor"</b> (ou publicada na web). No Google Sheets: <b>Compartilhar → Acesso geral → Qualquer pessoa com o link → Leitor</b>.`;
  document.getElementById("feed").innerHTML="";
});
</script>
</body>
</html>
