const cc={"APOIADOR":"var(--green)","COORDENADOR_POTENCIAL":"var(--purple)","VOTO_DECLARADO":"var(--accent)","POTENCIAL":"var(--yellow)","CONTRA":"var(--red)"};
const pc={"Facebook":"#3b82f6","Instagram":"#ec4899"};let cb="",pbb="";
for(const[k,v]of Object.entries(cl).sort((a,b)=>b[1]-a[1]))cb+=`<div class="bar-r"><span class="bar-lb">${k}</span><div class="bar-tk"><div class="bar-fl" style="width:${v/mxC*100}%;background:${cc[k]||"var(--muted)"}"></div></div><span class="bar-n">${v}</span></div>`;
for(const[k,v]of Object.entries(pl).sort((a,b)=>b[1]-a[1]))pbb+=`<div class="bar-r"><span class="bar-lb">${k}</span><div class="bar-tk"><div class="bar-fl" style="width:${v/mxP*100}%;background:${pc[k]||"var(--muted)"}"></div></div><span class="bar-n">${v}</span></div>`;
document.getElementById("minis").innerHTML=`<div class="mini"><h3><i class="fa-solid fa-tags" style="margin-right:4px"></i>Classificacao</h3>${cb}</div><div class="mini"><h3><i class="fa-solid fa-share-nodes" style="margin-right:4px"></i>Plataforma</h3>${pbb}</div>`;
function bdg(c){const m={"APOIADOR":"b-apo","COORDENADOR_POTENCIAL":"b-coord","VOTO_DECLARADO":"b-voto","POTENCIAL":"b-pot","CONTRA":"b-con"};return`<span class="bdg ${m[c]||""}">${c||"—"}</span>`}
function platB(p){const ig=(p||"").toUpperCase().includes("INSTAGRAM");return`<span class="bdg ${ig?"b-ig":"b-fb"}"><i class="fa-brands fa-${ig?"instagram":"facebook"}" style="margin-right:3px"></i>${ig?"IG":"FB"}</span>`}
function tr(s,n){return(s||"").length>n?(s||"").substring(0,n)+"…":(s||"—")}
function buildTbl(items,showSt){if(!items.length)return'<div class="empty"><i class="fa-solid fa-inbox"></i>Nenhum item</div>';let h='<div class="srch"><input type="text" placeholder="Buscar..." oninput="filt(this)"><button class="fbtn" onclick="pf(this,\'FB\')" data-f="FB"><i class="fa-brands fa-facebook"></i> FB</button><button class="fbtn" onclick="pf(this,\'IG\')" data-f="IG"><i class="fa-brands fa-instagram"></i> IG</button></div><div class="tw"><table><thead><tr><th>#</th><th>Data</th><th>Plat</th><th>Autor</th><th>Classif</th><th>Comentario / Resposta</th>';if(showSt)h+='<th>Status</th>';h+='<th>Link</th></tr></thead><tbody>';for(const e of items){const st=e.status.startsWith("ENVIADO")?'<span class="bdg b-e"><i class="fa-solid fa-check" style="margin-right:2px"></i>OK</span>':'<span class="bdg b-p"><i class="fa-solid fa-clock" style="margin-right:2px"></i>Fila</span>';h+=`<tr data-s="${(e.nome+" "+e.comentario+" "+e.resposta+" "+e.classificacao+" "+e.plataforma).toLowerCase()}" data-p="${(e.plataforma||"").toUpperCase().includes("INSTAGRAM")?"IG":"FB"}"><td class="rn">${e.row}</td><td class="ts">${e.data_hora||"—"}</td><td>${platB(e.plataforma)}</td><td><span class="nm" title="${e.nome||"Desconhecido"}">${tr(e.nome||"Desconhecido",14)}</span></td><td>${bdg(e.classificacao)}</td><td class="cm"><div class="cm-t">${tr(e.comentario,100)}</div>${e.resposta?'<div class="cm-rl"><i class="fa-solid fa-robot" style="margin-right:2px"></i>IA</div><div class="cm-resp">'+tr(e.resposta,150)+'</div>':""}</td>`;if(showSt)h+=`<td>${st}</td>`;h+=`<td>${e.link?'<a href="'+e.link+'" target="_blank" rel="noopener" class="lk"><i class="fa-solid fa-arrow-up-right-from-square"></i>Ver</a>':'<span class="lk off">—</span>'}</td></tr>`}h+='</tbody></table></div>';return h}
document.getElementById("pe").innerHTML=buildTbl(D.enviados,false);document.getElementById("pp").innerHTML=buildTbl(D.pendentes,false);document.getElementById("pa").innerHTML=buildTbl([...D.enviados,...D.pendentes],true);
document.querySelectorAll(".tab").forEach(t=>t.addEventListener("click",()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("on"));document.querySelectorAll(".pnl").forEach(x=>x.classList.remove("on"));t.classList.add("on");document.getElementById({"env":"pe","pend":"pp","all":"pa"}[t.dataset.t]).classList.add("on")}));
window.filt=function(inp){const q=inp.value.toLowerCase();inp.closest(".pnl").querySelectorAll("tbody tr").forEach(r=>{r.style.display=r.dataset.s.includes(q)?"":"none"})};
window._af=new Set();window.pf=function(btn,p){if(_af.has(p)){_af.delete(p);btn.classList.remove("on")}else{_af.add(p);btn.classList.add("on")}btn.closest(".pnl").querySelectorAll("tbody tr").forEach(r=>{r.style.display=_af.size===0?"":(_af.has(r.dataset.p)?"":"none")})};
</script>
</body>
</html>
